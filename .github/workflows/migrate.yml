name: Migrate to Mojang mappings
on:
  push:
    branches: [migrate]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.1" --input src/main/java --output remappedSrc
      - run: |
          ls remappedSrc
          rm -rf src/main/java && mv remappedSrc src/main/java
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b mojmap
          git add -A
          git commit -m "Migrate sources to Mojang mappings (1.21.1)"
          git push -f origin mojmap
