name: Build Pip's Party Palace (Fabric, Forge, NeoForge)
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Use the newest Forge and NeoForge builds for 26.1.2
        run: |
          F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o '<version>26\.1\.2-[^<]*' | sed 's/<version>26.1.2-//' | sort -V | tail -1)
          N=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>26\.1\.2\.[^<]*' | sed 's/<version>//' | sort -V | tail -1)
          echo "forge=$F neoforge=$N"
          [ -n "$F" ] && sed -i "s/^forge_version=.*/forge_version=$F/" gradle.properties
          [ -n "$N" ] && sed -i "s/^neoforge_version=.*/neoforge_version=$N/" gradle.properties
          grep -E "forge_version|neoforge_version" gradle.properties
      - name: Build
        run: chmod +x gradlew && ./gradlew build dumpCp --stacktrace --continue
      - name: Dump loader APIs
        if: always() && contains(github.event.head_commit.message, '[dump]')
        run: |
          bash tools/dump_api.sh
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan pips-apidump
          git rm -rf --cached . >/dev/null
          git add -f dump
          git commit -qm "API dump"
          git push -f origin pips-apidump
      - name: Publish jars to the pips-jars branch
        if: success()
        run: |
          mkdir -p /tmp/out && cp fabric/build/libs/*.jar forge/build/libs/*.jar neoforge/build/libs/*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan pips-jars
          git rm -rf --cached . >/dev/null
          rm -rf jars && mkdir jars && cp /tmp/out/*.jar jars/
          git add -f jars
          git commit -qm "Jars for ${GITHUB_SHA}"
          git push -f origin pips-jars
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pips-party-palace-jars
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: warn
