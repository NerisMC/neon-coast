name: API dump
on:
  push:
    branches: [apidump2]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && (./gradlew compileJava || true)
      - run: |
          mkdir -p dump
          MC=""
          for j in $(find ~/.gradle -name "*.jar" -path "*minecraft*" -size +5M); do
            if unzip -Z1 "$j" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class"; then MC="$j"; break; fi
          done
          echo "MC jar: $MC"; echo "$MC" > dump/mc-jar-path.txt
          unzip -Z1 "$MC" | grep '\.class$' | grep -v '\$[0-9]' | sed 's/\.class$//; s#/#.#g' | sort > dump/mc-classes.txt
          split -l 300 dump/mc-classes.txt /tmp/batch_
          for b in /tmp/batch_*; do javap -protected -cp "$MC" $(cat $b) >> dump/mc-api.txt 2>/dev/null || true; done
          FJARS=$(find ~/.gradle/caches/modules-2 -name "fabric-*.jar" -not -name "*sources*" -not -name "fabric-loader*" | sort -u)
          CP=$(echo $FJARS | tr ' ' ':'):$MC
          for j in $FJARS; do unzip -Z1 $j | grep '\.class$' | grep 'net/fabricmc/fabric/api' | grep -v '\$[0-9]' | sed 's/\.class$//; s#/#.#g'; done | sort -u > dump/fabric-classes.txt
          split -l 200 dump/fabric-classes.txt /tmp/fb_
          for b in /tmp/fb_*; do javap -protected -cp "$CP" $(cat $b) >> dump/fabric-api.txt 2>/dev/null || true; done
          wc -l dump/*.txt
          gzip -9 dump/mc-api.txt dump/fabric-api.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apidump-out2
          git rm -rq --cached .
          git add dump
          git commit -qm "API dump for 26.1.2"
          git push -f origin apidump-out2
