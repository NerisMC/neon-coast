name: Build mod jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - name: Print vanilla 26.1.2 data formats (reference)
        if: always()
        continue-on-error: true
        run: |
          J=$(find ~/.gradle/caches -name "minecraft-*.jar" -path "*26.1.2*" | head -5)
          echo "$J"
          for j in $J; do for p in data/minecraft/worldgen/biome/plains.json data/minecraft/worldgen/world_preset/flat.json data/minecraft/worldgen/flat_level_generator_preset/classic_flat.json data/minecraft/recipe/iron_pickaxe.json assets/minecraft/items/iron_ingot.json assets/minecraft/equipment/leather.json; do echo "=== $j $p"; unzip -p "$j" "$p" 2>/dev/null; done; done
      - uses: actions/upload-artifact@v4
        with:
          name: neon-coast-jar-26.1.2
          path: build/libs/neon-coast-2.0.0.jar
          if-no-files-found: error
